services:
  postgres:
    image: postgres:16
    ports:
      # Unsafe on a public VPS: PostgreSQL is reachable on all interfaces.
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
