services:
  app:
    image: ghcr.io/example/app:latest
    expose:
      - "8080"
    environment:
      APP_ENV: production

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  grafana:
    image: grafana/grafana:latest
    ports:
      # Local-only for reverse proxy access.
      - "127.0.0.1:3000:3000"

volumes:
  caddy-data:
